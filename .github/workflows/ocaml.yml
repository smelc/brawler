name: ocaml

on:
  push:
  merge_group:
  pull_request:

jobs:
  ocaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml (local opam switch in _opam/)
        uses: ocaml/setup-ocaml@v3
        with:
          # Keep in sync with dune-project and scripts/setup-opam.sh
          ocaml-compiler: ocaml-base-compiler.5.5.1
          opam-local-packages: brawler-kernel.opam

      - name: Install opam dependencies
        run: opam install . --deps-only --with-test --with-dev-setup -y

      - name: Fetch stategraph
        run: ./scripts/fetch-stategraph.sh

      - name: Check formatting (OCaml and dune files)
        run: opam exec -- dune build @fmt

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest
